<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>粗飯問卷</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h3 { color: #1DB446; }
        .option { margin: 10px 0; display: block; font-size: 18px; }
        input[type="checkbox"], input[type="radio"] { transform: scale(1.5); margin-right: 10px; }
        button { width: 100%; padding: 15px; background: #1DB446; color: white; border: none; border-radius: 8px; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Q1. 哪幾天可以粗飯？(複選)</h3>
        <label class="option"><input type="checkbox" name="date" value="5/20(三)"> 5/20(三) 晚上</label>
        <label class="option"><input type="checkbox" name="date" value="5/22(五)"> 5/22(五) 晚上</label>
        <label class="option"><input type="checkbox" name="date" value="5/23(六)"> 5/23(六) 中或晚</label>
        <label class="option"><input type="checkbox" name="date" value="5/24(日)"> 5/24(日) 中或晚</label>
        <label class="option"><input type="checkbox" name="date" value="5/26(二)"> 5/26(二) 晚上</label>
        <label class="option"><input type="checkbox" name="date" value="5/27(三)"> 5/27(三) 晚上</label>
        <label class="option"><input type="checkbox" name="date" value="5/29(五)"> 5/29(五) 晚上</label>

        <h3>Q2. 幾位參加呢？</h3>
        <label class="option"><input type="radio" name="num" value="1位" checked> 本輪一位</label>
        <label class="option"><input type="radio" name="num" value="2位"> 雙雙對對</label>
        <label class="option"><input type="radio" name="num" value="3位"> 3人行</label>
        <label class="option"><input type="radio" name="num" value="4位以上"> 全家動員</label>

        <button onclick="submitSurvey()">送出問卷</button>
    </div>

    <script>
        async function main() {
            await liff.init({ liffId: "你的_LIFF_ID" });
            if (!liff.isLoggedIn()) { liff.login(); }
        }
        main();

        async function submitSurvey() {
            const dates = Array.from(document.querySelectorAll('input[name="date"]:checked')).map(el => el.value);
            const num = document.querySelector('input[name="num"]:checked').value;
            
            if (dates.length === 0) { alert("請至少選一個日期喔！"); return; }

            const message = `📢 問卷完成報告！\n📍 日期：${dates.join(', ')}\n👥 人數：${num}`;
            
            // 這行會讓機器人幫使用者在群組「說出」這句話
            await liff.sendMessages([{ type: 'text', text: message }]);
            liff.closeWindow();
        }
    </script>
</body>
</html>
