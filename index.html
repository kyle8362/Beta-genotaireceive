<div class="modal-overlay" id="gameModal">
    <div class="modal-card" style="width: 400px; text-align: center;">
        <h3>🚀 伺服器除錯跑酷</h3>
        <div id="game-canvas" style="width: 100%; height: 150px; background: #111; margin: 10px 0; position: relative; overflow: hidden; border-radius: 8px;">
            <div id="player" style="width: 20px; height: 20px; background: #38bdf8; position: absolute; bottom: 0; left: 20px;"></div>
            <div id="obstacle" style="width: 20px; height: 30px; background: #ef4444; position: absolute; bottom: 0; right: -20px;"></div>
        </div>
        <p>按下「空白鍵」或點擊畫面跳躍！</p>
        <button class="btn btn-cancel" onclick="document.getElementById('gameModal').style.display='none'">關閉遊戲</button>
    </div>
</div>
