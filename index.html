<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>粗飯問卷</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h3 { color: #1DB446; margin-top: 20px; }
        .option { margin: 12px 0; display: flex; align-items: center; font-size: 16px; color: #333; }
        input[type="checkbox"], input[type="radio"] { transform: scale(1.3); margin-right: 12px; accent-color: #1DB446; }
        button { width: 100%; padding: 15px; background: #1DB446; color: white; border: none; border-radius: 8px; font-size: 18px; margin-top: 20px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #cccccc; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Q1. 哪幾天可以粗飯？(可複選)</h3>
        <label class="option"><input type="checkbox" name="date" value="5/20(三) 晚上"> 5/20(三) 晚上</label>
        <label class="option"><input type="checkbox" name="date" value="5/22(五) 晚上"> 5/22(五) 晚上</label>
        <label class="option"><input type="checkbox" name="date" value="5/23(六) 中或晚"> 5/23(六) 中或晚</label>
        <label class="option"><input type="checkbox" name="date" value="5/24(日) 中或晚"> 5/24(日) 中或晚</label>
        <label class="option"><input type="checkbox" name="date" value="5/26(二) 晚上"> 5/26(二) 晚上</label>
        <label class="option"><input type="checkbox" name="date" value="5/27(三) 晚上"> 5/27(三) 晚上</label>
        <label class="option"><input type="checkbox" name="date" value="5/29(五) 晚上"> 5/29(五) 晚上</label>
        
        <h3>Q2. 幾位參加呢？</h3>
        <label class="option"><input type="radio" name="num" value="本輪一位" checked> 本輪一位</label>
        <label class="option"><input type="radio" name="num" value="雙雙對對(2位)"> 雙雙對對 (2位)</label>
        <label class="option"><input type="radio" name="num" value="3人行必有八卦"> 3人行必有八卦</label>
        <label class="option"><input type="radio" name="num" value="全家老小都粗動"> 全家老小都粗動 (4位以上)</label>

        <button id="btn" onclick="submitSurvey()">送出問卷</button>
    </div>

    <script>
        async function main() {
            try {
                // ⚠️ 記得換成你真正的 LIFF ID
                await liff.init({ liffId: "2010074236-PzZ4at3s" }); 
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                }
            } catch (err) {
                alert("初始化失敗，請確認網路連線或 ID 設定。");
            }
        }
        main();

        async function submitSurvey() {
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.innerText = "傳送中...";

            try {
                const dates = Array.from(document.querySelectorAll('input[name="date"]:checked')).map(el => el.value);
                const num = document.querySelector('input[name="num"]:checked').value;
                
                if (dates.length === 0) { 
                    alert("請至少選一個可以吃飯的日期喔！"); 
                    btn.disabled = false;
                    btn.innerText = "送出問卷";
                    return; 
                }

                const message = `📢 粗飯意願回覆\n📍 日期：${dates.join(', ')}\n👥 人數：${num}`;

                if (!liff.isInClient()) {
                    alert("請在 LINE 裡面打開此問卷喔！");
                    btn.disabled = false;
                    btn.innerText = "送出問卷";
                    return;
                }

                await liff.sendMessages([{ type: 'text', text: message }]);
                liff.closeWindow();
            } catch (error) {
                alert("送出失敗，請再試一次！");
                btn.disabled = false;
                btn.innerText = "送出問卷";
            }
        }
    </script>
</body>
</html>
