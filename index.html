<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>粗飯問卷測試</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #status { color: red; font-weight: bold; margin-bottom: 10px; border: 1px solid red; padding: 5px; display: none; }
        .option { margin: 10px 0; display: block; font-size: 18px; }
        button { width: 100%; padding: 15px; background: #1DB446; color: white; border: none; border-radius: 8px; font-size: 18px; }
    </style>
</head>
<body>
    <div id="status"></div>
    <div class="card">
        <h3>Q1. 哪幾天可以粗飯？</h3>
        <label class="option"><input type="checkbox" name="date" value="5/20(三)"> 5/20(三) 晚上</label>
        <label class="option"><input type="checkbox" name="date" value="5/23(六)"> 5/23(六) 中或晚</label>
        
        <h3>Q2. 幾位參加呢？</h3>
        <label class="option"><input type="radio" name="num" value="1位" checked> 本輪一位</label>

        <button id="btn" onclick="submitSurvey()">送出問卷</button>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        function logError(msg) { statusDiv.style.display = 'block'; statusDiv.innerText = msg; }

        async function main() {
            try {
                // ⚠️ 檢查這裡！一定要換成你那串 200... 的 ID
                await liff.init({ liffId: "2010074236-PzZ4at3s" }); 
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    document.getElementById('btn').innerText = "已連線，可以送出";
                }
            } catch (err) {
                logError("LIFF 初始化失敗: " + err.message);
            }
        }
        main();

        async function submitSurvey() {
            try {
                const dates = Array.from(document.querySelectorAll('input[name="date"]:checked')).map(el => el.value);
                const num = document.querySelector('input[name="num"]:checked').value;
                if (dates.length === 0) { alert("選個日期吧！"); return; }

                const message = `📢 填寫完畢！\n📍 日期：${dates.join(', ')}\n👥 人數：${num}`;

                // 檢查權限
                if (!liff.isInClient()) {
                    alert("請在 LINE 裡面打開喔！");
                    return;
                }

                await liff.sendMessages([{ type: 'text', text: message }]);
                liff.closeWindow();
            } catch (error) {
                logError("送出失敗: " + error.message);
                alert("錯誤：" + error.message);
            }
        }
    </script>
</body>
</html>
